name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Xcode 26 is the oldest major version spec §4 allows; local development uses Xcode 27.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Run test plan (Default and Brazil configurations)
        run: >
          xcodebuild test
          -project BitcoinTicker.xcodeproj
          -scheme BitcoinTicker
          -testPlan BitcoinTicker
          -derivedDataPath build/DerivedData
